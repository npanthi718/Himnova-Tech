<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-skill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="glow-skill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
  </defs>
  <rect width="600" height="340" rx="16" fill="url(#bg-skill)"/>
  <!-- Ambient Grid -->
  <path d="M 0 60 L 600 60 M 0 120 L 600 120 M 0 180 L 600 180 M 0 240 L 600 240 M 0 300 L 600 300" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>
  
  <!-- UI Window Container -->
  <rect x="30" y="30" width="540" height="280" rx="12" fill="#1E293B" stroke="url(#glow-skill)" stroke-width="1.5" opacity="0.9"/>
  <!-- Window Controls -->
  <circle cx="55" cy="50" r="5" fill="#EF4444"/>
  <circle cx="72" cy="50" r="5" fill="#F59E0B"/>
  <circle cx="89" cy="50" r="5" fill="#10B981"/>
  
  <!-- Brand Logo Tagline in Card Background -->
  <text x="540" y="54" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#06B6D4" text-anchor="end">SkillNexus v2.0</text>

  <!-- Mockup UI Cards -->
  <rect x="55" y="80" width="220" height="200" rx="8" fill="#0B0F19" stroke="#06B6D4" stroke-width="1" opacity="0.8"/>
  <rect x="70" y="98" width="120" height="12" rx="4" fill="#06B6D4"/>
  <rect x="70" y="120" width="180" height="8" rx="3" fill="#64748B"/>
  <rect x="70" y="136" width="150" height="8" rx="3" fill="#475569"/>

  <rect x="295" y="80" width="250" height="90" rx="8" fill="#0B0F19" stroke="#0EA5E9" stroke-width="1" opacity="0.8"/>
  <text x="315" y="115" font-family="'Outfit', sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Peer Learning Room</text>
  <rect x="315" y="130" width="100" height="24" rx="12" fill="#0284C7"/>
  <text x="365" y="146" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">LIVE SESSION</text>

  <rect x="295" y="185" width="250" height="95" rx="8" fill="#0B0F19" stroke="#334155" stroke-width="1"/>
  <circle cx="330" cy="225" r="18" fill="#06B6D4"/>
  <rect x="360" y="215" width="110" height="10" rx="3" fill="#E2E8F0"/>
  <rect x="360" y="232" width="80" height="8" rx="3" fill="#94A3B8"/>
