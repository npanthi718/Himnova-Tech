<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#070A10" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#grid)" />
  <circle cx="600" cy="315" r="380" fill="url(#glow)" />

  {/* Outer Window Frame */}
  <rect x="60" y="50" width="1080" height="530" rx="24" fill="rgba(17, 24, 39, 0.75)" stroke="rgba(139, 92, 246, 0.3)" stroke-width="2" />
  
  {/* Header Window Dots */}
  <circle cx="100" cy="90" r="7" fill="#EF4444" />
  <circle cx="125" cy="90" r="7" fill="#F59E0B" />
  <circle cx="150" cy="90" r="7" fill="#10B981" />
  <line x1="60" y1="120" x2="1140" y2="120" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />

  {/* Neural Network Nodes Visual Flow */}
  <g transform="translate(100, 160)">
    {/* Input Prompt Box */}
    <rect x="0" y="40" width="240" height="180" rx="16" fill="rgba(255,255,255,0.03)" stroke="rgba(139, 92, 246, 0.4)" stroke-width="1.5" />
    <rect x="20" y="65" width="140" height="14" rx="4" fill="#8B5CF6" />
    <rect x="20" y="95" width="200" height="10" rx="3" fill="rgba(255,255,255,0.4)" />
    <rect x="20" y="115" width="160" height="10" rx="3" fill="rgba(255,255,255,0.4)" />
    <rect x="20" y="145" width="100" height="35" rx="8" fill="url(#purpleGrad)" />

    <line x1="240" y1="130" x2="340" y2="130" stroke="#8B5CF6" stroke-width="3" stroke-dasharray="6 6" />

    {/* Center LLM Inference Node */}
    <rect x="340" y="0" width="300" height="260" rx="20" fill="rgba(139, 92, 246, 0.08)" stroke="#8B5CF6" stroke-width="2" />
    <circle cx="490" cy="80" r="35" fill="url(#purpleGrad)" />
    <rect x="410" y="135" width="160" height="16" rx="4" fill="#FFFFFF" />
    <rect x="380" y="165" width="220" height="70" rx="10" fill="rgba(255,255,255,0.05)" />

    <line x1="640" y1="130" x2="740" y2="130" stroke="#06B6D4" stroke-width="3" stroke-dasharray="6 6" />

    {/* Vector Database RAG Storage */}
    <rect x="740" y="40" width="240" height="180" rx="16" fill="rgba(255,255,255,0.03)" stroke="rgba(6,182,212,0.4)" stroke-width="1.5" />
    <circle cx="780" cy="80" r="16" fill="#06B6D4" />
    <rect x="810" y="72" width="130" height="14" rx="4" fill="rgba(255,255,255,0.8)" />
    <rect x="760" y="115" width="200" height="12" rx="4" fill="rgba(6,182,212,0.2)" />
    <rect x="760" y="135" width="200" height="12" rx="4" fill="rgba(6,182,212,0.2)" />
    <rect x="760" y="155" width="200" height="12" rx="4" fill="rgba(6,182,212,0.2)" />
  </g>

  {/* Status Footer Bar */}
  <rect x="100" y="470" width="980" height="60" rx="14" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)" />
  <circle cx="140" cy="500" r="8" fill="#8B5CF6" />
  <text x="160" y="504" fill="#E2E8F0" font-family="monospace" font-size="14" font-weight="bold">AI ENGINE ACTIVE: REAL-TIME RAG VECTOR INFERENCE | ZERO PRIVACY LEAK</text>
</svg>