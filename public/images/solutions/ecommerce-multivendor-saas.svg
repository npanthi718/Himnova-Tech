<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070A10" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#grid)" />
  <circle cx="600" cy="315" r="350" fill="url(#glow)" />

  {/* Outer Glass Window Frame */}
  <rect x="60" y="50" width="1080" height="530" rx="24" fill="rgba(17, 24, 39, 0.7)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="2" />
  
  {/* Header Window Dots */}
  <circle cx="100" cy="90" r="7" fill="#EF4444" />
  <circle cx="125" cy="90" r="7" fill="#F59E0B" />
  <circle cx="150" cy="90" r="7" fill="#10B981" />
  <line x1="60" y1="120" x2="1140" y2="120" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />

  {/* Visual Dashboard Cards */}
  <g transform="translate(100, 160)">
    {/* Node Card 1 */}
    <rect x="0" y="0" width="280" height="160" rx="16" fill="rgba(255,255,255,0.03)" stroke="rgba(6,182,212,0.4)" stroke-width="1.5" />
    <circle cx="40" cy="40" r="16" fill="url(#cyanGrad)" />
    <rect x="70" y="32" width="120" height="14" rx="4" fill="rgba(255,255,255,0.8)" />
    <rect x="70" y="54" width="80" height="10" rx="3" fill="rgba(6,182,212,0.6)" />
    <rect x="20" y="90" width="240" height="40" rx="8" fill="rgba(6,182,212,0.1)" />

    {/* Connecting Line */}
    <line x1="280" y1="80" x2="350" y2="80" stroke="#06B6D4" stroke-width="3" stroke-dasharray="6 6" />

    {/* Center High-Speed Engine Node */}
    <rect x="350" y="20" width="280" height="260" rx="20" fill="rgba(6,182,212,0.08)" stroke="#06B6D4" stroke-width="2" />
    <circle cx="490" cy="90" r="40" fill="url(#cyanGrad)" />
    <rect x="410" y="150" width="160" height="16" rx="4" fill="#FFFFFF" />
    <rect x="430" y="176" width="120" height="12" rx="3" fill="#10B981" />
    <rect x="380" y="205" width="220" height="50" rx="10" fill="rgba(255,255,255,0.05)" />

    {/* Connecting Line */}
    <line x1="630" y1="80" x2="700" y2="80" stroke="#10B981" stroke-width="3" stroke-dasharray="6 6" />

    {/* Node Card 3 */}
    <rect x="700" y="0" width="280" height="160" rx="16" fill="rgba(255,255,255,0.03)" stroke="rgba(16,185,129,0.4)" stroke-width="1.5" />
    <circle cx="740" cy="40" r="16" fill="#10B981" />
    <rect x="770" y="32" width="120" height="14" rx="4" fill="rgba(255,255,255,0.8)" />
    <rect x="770" y="54" width="80" height="10" rx="3" fill="rgba(16,185,129,0.6)" />
    <rect x="720" y="90" width="240" height="40" rx="8" fill="rgba(16,185,129,0.1)" />
  </g>

  {/* Bottom Telemetry Bar */}
  <rect x="100" y="470" width="980" height="60" rx="14" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)" />
  <circle cx="140" cy="500" r="8" fill="#10B981" />
  <text x="160" y="504" fill="#E2E8F0" font-family="monospace" font-size="14" font-weight="bold">SYSTEM STATUS: 99.99% UPTIME | HIGH THROUGHPUT ENGINE ACTIVE</text>
</svg>